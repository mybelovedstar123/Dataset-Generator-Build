name: Bug report
description: The generator fails, hangs or produces wrong output
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest snippet that shows it, with the seed, config_dir and number of rows requested.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and the installed numpy / scipy / numba versions.
      render: text
